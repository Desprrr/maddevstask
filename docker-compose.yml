services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: monitor
      POSTGRES_DB: monitor
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Порт на хост сознательно не публикуется: нужен только backend'у по
    # внутренней docker-сети. Если нужен psql снаружи для отладки —
    # `docker compose exec postgres psql -U monitor monitor`, без публикации
    # порта; либо временно раскомментируйте и задайте POSTGRES_PORT в .env.
    # ports:
    #   - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Заглушка для писем: реальный SMTP-сервер только для локальной разработки,
  # письма никуда не уходят за пределы docker-сети. SMTP (1025) нужен только
  # backend'у внутри сети — наружу публикуется только веб-инбокс.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"

  # Эмулятор проверяемых сайтов — входит в задание, а не внешняя зависимость.
  target-emulator:
    build: ./target-emulator
    ports:
      - "${TARGET_EMULATOR_PORT:-9100}:9100"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://monitor:monitor@postgres:5432/monitor
      DATABASE_SSL: "false"
      EMAIL_BACKEND: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: monitor@example.com
      CORS_ORIGINS: '["http://localhost:8080"]'
      TARGET_EMULATOR_BASE_URL: http://target-emulator:9100
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
      target-emulator:
        condition: service_started
    # Порт настраивается через BACKEND_PORT (.env или переменная окружения) —
    # 8000 у многих серверов уже занят другим сервисом, дефолт можно
    # переопределить без правки этого файла.
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  pgdata:
