name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: monitor
          POSTGRES_PASSWORD: monitor
          # conftest.py тестовой БД ждёт именно monitor_test — сервис Postgres
          # создаёт эту базу сам через POSTGRES_DB при старте контейнера.
          POSTGRES_DB: monitor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monitor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: pytest -q

  target-emulator-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: target-emulator/requirements.txt

      - name: Install target-emulator dependencies
        working-directory: target-emulator
        run: pip install -r requirements.txt

      - name: Run target-emulator tests
        working-directory: target-emulator
        run: pytest -q

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check and build
        working-directory: frontend
        run: npm run build

  # Собирает все три Dockerfile'а и реально поднимает docker-compose (не
  # только проверяет, что образы собираются) — тот же прогон, что делался
  # вручную при разработке (см. DECISIONS.md), теперь автоматически на
  # каждый push/PR.
  docker-e2e:
    runs-on: ubuntu-latest
    needs: [backend-tests, target-emulator-tests, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the full stack
        run: docker compose up --build -d

      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "backend healthy"
              exit 0
            fi
            sleep 2
          done
          echo "backend did not become healthy in time"
          docker compose logs
          exit 1

      - name: Check frontend responds
        run: curl -sf http://localhost:8080/ > /dev/null

      - name: Check demo data was seeded
        run: |
          count=$(curl -sf http://localhost:8000/api/checks | python3 -c "import sys, json; print(len(json.load(sys.stdin)))")
          echo "seeded checks: $count"
          test "$count" -ge 1

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
